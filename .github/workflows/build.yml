name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset win32

      - name: Build
        run: cmake --build --preset release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist/ | Out-Null
          Copy-Item build/bin/mirror_core.dll dist/
          Copy-Item lua/mirror.lua dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Zip artifact
        run: (cd mirror && zip -r "../mirror-${{ github.ref_name }}.zip" .)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --draft --title "${{ github.ref_name }}" --generate-notes
