name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: mirror
            configure_preset: win32
            build_preset: release
            build_dir: build
          - name: mirror-streaming
            configure_preset: win32-streaming
            build_preset: release-streaming
            build_dir: build-streaming
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist/ | Out-Null
          Copy-Item ${{ matrix.build_dir }}/bin/mirror_core.dll dist/
          Copy-Item lua/mirror.lua dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Zip variants
        run: |
          for variant in mirror mirror-streaming; do
            (cd "$variant" && zip -r "../$variant-${{ github.ref_name }}.zip" .)
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --draft --title "${{ github.ref_name }}" --generate-notes
